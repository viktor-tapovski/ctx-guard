name: Release

on:
  push:
    branches: [main]

# Least privilege: release-please needs to push the release branch and open
# the release PR, nothing else. Everything below inherits no other scope.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The default GITHUB_TOKEN cannot trigger other workflows, so ci.yml does
      # not run on the release PR. That PR only edits CHANGELOG.md, version.txt
      # and hooks/lib/version.py, all of which CI already saw on the commits
      # being released. Swap in a PAT or app token if that ever stops holding.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

  # Attach the curl installer's files to the release, then publish get.sh
  # and the formula to the ctx-guard org's installer repos. Both carry the
  # tarball's SHA-256, so both installers refuse a tarball that doesn't match.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Build tarball and render installers
        run: |
          git archive --prefix="ctx-guard-$VERSION/" -o "ctx-guard-$VERSION.tar.gz" "$TAG"
          sha="$(sha256sum "ctx-guard-$VERSION.tar.gz" | cut -d' ' -f1)"
          packaging/render.sh "$VERSION" "$sha" dist
          mv "ctx-guard-$VERSION.tar.gz" dist/
          (cd dist && sha256sum "ctx-guard-$VERSION.tar.gz" get.sh > SHA256SUMS)
          bash -n dist/get.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/ctx-guard-"$VERSION".tar.gz dist/get.sh dist/SHA256SUMS --clobber
      # INSTALLERS_TOKEN: a fine-grained token with contents:write on
      # ctx-guard/homebrew-tap and ctx-guard/install only. Without it, publish
      # by hand (docs/releasing.md).
      - name: Publish to ctx-guard/homebrew-tap and ctx-guard/install
        env:
          INSTALLERS_TOKEN: ${{ secrets.INSTALLERS_TOKEN }}
        run: |
          if [ -z "$INSTALLERS_TOKEN" ]; then
            echo "::warning::INSTALLERS_TOKEN is not set; publish the installers by hand (docs/releasing.md)"
            exit 0
          fi
          publish() {  # publish REPO SOURCE TARGET_PATH
            git clone "https://x-access-token:${INSTALLERS_TOKEN}@github.com/ctx-guard/$1.git" "repo-$1"
            mkdir -p "repo-$1/$(dirname "$3")"
            cp "$2" "repo-$1/$3"
            git -C "repo-$1" config user.name "github-actions[bot]"
            git -C "repo-$1" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "repo-$1" add "$3"
            git -C "repo-$1" commit -m "ctx-guard $VERSION"
            git -C "repo-$1" push
          }
          publish homebrew-tap dist/ctx-guard.rb Formula/ctx-guard.rb
          publish install dist/get.sh get.sh
