name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check shell syntax
        run: bash -n install.sh bin/ctx-guard-run
      - name: Check Python syntax
        run: python3 -m py_compile hooks/*.py hooks/lib/*.py bin/ctx-guard-stats bin/ctx-guard-uninstall
      - name: Run smoke tests
        run: bash tests/smoke.sh

  # Both strings matter and they are not the same string: commitlint checks the
  # branch history, the title check covers the squash subject that actually
  # lands on main and becomes the changelog bullet.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
      - name: Lint pull request title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
