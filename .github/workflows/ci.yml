name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check shell syntax
        # bash -n parses only its first file, so check each one.
        run: for f in install.sh get.sh packaging/render.sh bin/ctx-guard bin/ctx-guard-run bin/ctx-guard-try; do bash -n "$f"; done
      - name: Check Python syntax
        run: python3 -m py_compile hooks/*.py hooks/lib/*.py bin/ctx-guard-stats bin/ctx-guard-uninstall
      - name: Check stdlib-only imports and no binaries
        if: runner.os == 'Linux'
        run: python3 tests/check_stdlib_only.py
      - name: Run smoke tests
        run: bash tests/smoke.sh
      - name: Run Python tests (offline; registry lookups are stubbed)
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  # Both strings matter and they are not the same string: commitlint checks the
  # branch history, the title check covers the squash subject that actually
  # lands on main and becomes the changelog bullet.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
      - name: Lint pull request title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
